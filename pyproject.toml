[tool.uv]
config-settings = { editable_mode = "compat" }

[project]
name = "neuralvoid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.12.0",
    "neuralcore",
    "pillow>=12.2.0",
    "pypdf>=6.9.2",
    "python-docx>=1.2.0",
    "textual>=0.81.1",
    "websockets>=16.0",
]

[tool.pyright]  
venvPath = "."     
venv = ".venv"

[tool.uv.sources]
neuralcore = { path = "../NeuralCore", editable = true }

[project.scripts]
neuralvoid = "neuralvoid.main:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0", "toml>=0.10.2"]
build-backend = "uv_build"


