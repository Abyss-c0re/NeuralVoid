clients:
  main:
    type: chat
    base_url: http://localhost:1212/v1
    model: qwen3.5-9b
    tokenizer: /home/user/Dev/AI/model/tokenizer.json
    api_key_env: LLM_API_KEY

    # generation tuning
    presence_penalty: 1.5
    top_k: 20
    temperature: 0.85
    max_tokens: 64000

    system_prompt: "You are a helpful and efficient terminal assistant."

    # 🔧 expose as tool (optional lightweight model)
    register_as_tool: true
    tool_name: FastAssistant
    description: "Fast general-purpose assistant for quick responses"

    methods:
      - target: ask
        name: quick_answer
        description: "Fast single-turn answer"
        tags: ["fast", "qa", "cheap"]

      - target: chat
        name: short_chat
        description: "Short conversational response"
        tags: ["chat", "fast"]

  reasoning:
    type: chat
    model: qwen3.5-9b
    tokenizer: /home/user/Dev/AI/model/tokenizer.json

    # reasoning tuning
    presence_penalty: 1.2
    top_k: 30
    enable_thinking: true
    temperature: 0.4
    max_tokens: 64000

    system_prompt: "You are a deep reasoning assistant. Think step by step before answering."

    # 🧠 expose as high-level reasoning tool
    register_as_tool: true
    tool_name: HeavyReasoning
    description: "Strong reasoning model for planning and complex multi-step tasks"

    methods:
      - target: ask
        name: deep_think
        description: "Careful multi-step reasoning for complex problems"
        tags: ["reasoning", "planning"]


embeddings:
  use_fastembed: true # ← set false to force original llama.cpp
  fastembed_model: "BAAI/bge-small-en-v1.5"
  fastembed_cache_dir: "~/.neuralcore/cache/fastembed"

tools:
  FileEditingTools:
    modules:
      - file_set
  TerminalTools:
    modules:
      - terminal_set
  CodingTools:
    modules:
      - code_set
  WebTools:
    modules:
      - web_set
  ResearchTools:
    modules:
      - research_set

workflows:
  deploy_agent:
    name: "deploy_agent"
    description: "Persistent natural conversation mode for Deploy Agent"
    steps:
      - name: deploy_agent_loop

agents:
  agent_001:
    id: "agent_001"
    name: "Headless Reasoner"
    description: "Main orchestrator agent - plans and deploys sub-agents for complex tasks"
    client: reasoning
    max_iterations: -1
    temperature: 0.35
    max_tokens: 64000
    max_sub_agents: 8
    tool_sets:
      - FileEditingTools
      - TerminalTools
      - CodingTools
      - WebTools
      - ResearchTools
    workflow: deploy_agent

  agent_002:
    id: "agent_002"
    name: "Terminal Chat Agent"
    description: "Terminal assistant - starts in natural chat mode"
    client: main
    max_iterations: 100
    temperature: 0.8
    max_tokens: 64000
    max_sub_agents: 5
    system_prompt: "You are a helpful and efficient terminal assistant."
    tool_sets:
      - FileEditingTools
      - TerminalTools
      - CodingTools
      - WebTools
      - ResearchTools
    workflow: deploy_agent

  sub_agent_002:
    id: "sub_agent_002"
    name: "Terminal Sub-Agent"
    description: "Sub-agent spawned by Terminal Chat Agent"
    client: main
    is_sub_agent: true
    max_iterations: 12
    temperature: 0.3
    max_tokens: 64000
    system_prompt: "You are a focused sub-agent helping the main Terminal Chat Agent."
    tool_sets:
      - FileEditingTools
      - TerminalTools
      - ResearchTools

    workflow: deploy_agent

# Optional: Global defaults / settings
settings:
  default_max_sub_agents: 6
  sub_agent_temperature: 0.25
  sub_agent_max_iterations: 15 # ← simple string, this is what you want for chat

app:
  max_iterations: -1
  max_tokens: 64000
  logging_enabled: true
  log_level: debug
  log_to_file: true
  log_to_ui: false
  log_file: ~/.neuralcore/neuralvoid.log
  tool_info_level: compact
  models_dir: ~/.neuralcore/models
  cognition:
    reranker_enabled: true
    novelty_threshold: 0.82
    novelty_k: 100
    max_rerank_candidates: 100 # ← how many to rerank
    semantic_weight: 0.28
    recency_decay_lambda: 0.06
  knowledge_base:
    enabled: true
    base_folder: "~/.neuralcore/kb" # Root folder for all indexed data
    auto_reindex: true # Automatically watch for file changes
    reindex_interval_seconds: 300
    default_retrieve_k: 100
    min_similarity_threshold: 0.15
    direct_match_boost: 0.18
    direct_match_threshold: 0.23
